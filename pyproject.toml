[project]
name = "gameloc"
version = "0.1.0"
description = "gameloc: engine-agnostic AI translation and three-pass proofreading for video game text (Unity, Unreal, custom engines)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "apidlypnyi" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["localization", "translation", "games", "llm", "unity", "unreal", "i18n", "proofreading", "l10n", "gameloc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Localization",
    "Typing :: Typed",
]

[project.scripts]
gameloc = "gameloc.cli:main"

[project.urls]
Documentation = "https://github.com/apidlypnyi/gameloc/tree/main/docs"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.15", "ruff>=0.12"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
per-file-ignores = { "src/gameloc/prompts.py" = ["E501"] }

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
